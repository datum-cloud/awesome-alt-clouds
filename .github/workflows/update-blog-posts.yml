name: Update Blog Posts

# NOTE: The scheduled cron is paused during the Astro migration (Phase 1).
# This workflow patches docs/index.html which is being replaced by the Astro
# site at src/pages/. Once Phase 3 (Editorial / Blog) lands, this workflow
# will be retired or retargeted to write to src/content/blog/.
# See: analysis/2026-05-19-astro-migration-rfc.md
on:
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger only

jobs:
  update-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch and update blog posts
        run: python scripts/update_blog_posts.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet docs/index.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update-blog-posts-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add docs/index.html
          git commit -m "Update blog posts from Zac Smith's author page"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update blog posts from Zac Smith's author page" \
            --body "Automated daily update of blog posts from Strapi/Zac Smith's author page." \
            --base main \
            --head "$BRANCH" \
            --label "automated" || true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
