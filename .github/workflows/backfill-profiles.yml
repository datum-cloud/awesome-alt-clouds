name: Backfill Cloud Profiles

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of clouds to generate (max 30)"
        required: false
        default: "20"
      category_filter:
        description: "Only generate for this exact category (leave blank for all)"
        required: false
        default: ""
      score_filter:
        description: "Only generate for clouds with this score: 2, 3, or all"
        required: false
        default: "3"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4

      - name: Run backfill
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          CATEGORY_FILTER: ${{ github.event.inputs.category_filter }}
          SCORE_FILTER: ${{ github.event.inputs.score_filter }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/backfill_profiles.py

      - name: Check if any MDX files were generated
        id: check_files
        run: |
          count=$(git status --porcelain src/content/clouds/ | grep -c '\.mdx' || echo 0)
          echo "mdx_count=${count}" >> "$GITHUB_OUTPUT"
          echo "Generated ${count} MDX file(s)"

      - name: Create PR with generated profiles
        if: steps.check_files.outputs.mdx_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="generated-profiles-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/clouds/
          COUNT=$(git diff --cached --name-only | grep -c '\.mdx' || echo 0)
          git commit -m "feat(profiles): auto-generate ${COUNT} cloud detail profiles [needs-verification]"
          git push origin "$BRANCH"

          # Render the body via a Python helper so we can interpolate from backfill_summary.json safely.
          python3 <<'PY' > pr_body.md
          import json
          with open("backfill_summary.json") as f:
              s = json.load(f)
          succeeded = s["succeeded"]
          failed = s["failed"]
          reports = s.get("reports", [])
          needs_verify = [r for r in reports if r.get("needs_verification")]

          print("## Auto-generated cloud profiles")
          print()
          print("All profiles are marked `status: draft` in frontmatter.")
          print("They will only be built into HTML when `site.config.mjs` has `preview: true`.")
          print("A DraftBanner is shown on each draft profile page.")
          print()
          print(f"Generated **{succeeded}** profiles, **{failed}** failed.")
          print()
          if needs_verify:
              print("### Profiles requiring extra verification (WebSearch fallback used)")
              for r in needs_verify:
                  slug = r["slug"]
                  print(f"- [{slug}](src/content/clouds/{slug}.mdx)")
              print()
          print("### Review checklist")
          print("- [ ] Spot-check 3-5 profiles for factual accuracy (pricing numbers, regions, socials)")
          print("- [ ] Verify draft profiles render on fork deploy (`preview: true`) but are excluded from production")
          print("- [ ] Mark accurate profiles as `status: reviewed` in a follow-up PR (required for production HTML)")
          print("- [ ] Delete any profiles that are significantly inaccurate")
          print()
          print("*Generated by `backfill-profiles.yml` workflow.*")
          PY

          gh pr create \
            --title "feat(profiles): auto-generate cloud detail profiles (batch)" \
            --body-file pr_body.md \
            --label "generated-profiles,needs-verification" \
            --head "$BRANCH"
