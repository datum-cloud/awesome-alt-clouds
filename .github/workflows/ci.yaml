name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      node-version: "26.13.0"
      skip: build
      run: npm run format:check && python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt && "$RUNNER_TEMP/venv/bin/python" scripts/parse_readme_to_json.py README.md public/clouds.json && "$RUNNER_TEMP/venv/bin/python" scripts/generate_llms.py public/clouds.json public/ && "$RUNNER_TEMP/venv/bin/python" scripts/generate_watchlist_json.py && npm run build && "$RUNNER_TEMP/venv/bin/pytest" -q
