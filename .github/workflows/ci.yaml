name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      node-version: "26.13.0"
      run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt && "$RUNNER_TEMP/venv/bin/pytest" -q && npm run format:check
