[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long issue-comment templates and README insert blocks
"scripts/create_submission_pr.py" = ["E501"]
"scripts/evaluate_submission.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
